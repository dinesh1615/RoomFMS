spring.application.name=roomfms
server.address=0.0.0.0
server.port=8080


# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/roomfms
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Security JWT Secret
roomfms.jwt.secret=9a6747134338297a02860e33c301726a45747134338297a02860e33c301726a45
roomfms.jwt.expiration=86400000

# File Upload (Optional for profile photos)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
